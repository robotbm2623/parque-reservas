function render(p){
  if(!reservationUser && me.role==='guest'){return}
  const main=$('#main');
  try{
    if(!main) throw new Error('Área principal do sistema não encontrada.');
    renderPage(p);
    const footer=document.createElement('footer');
    footer.className='site-footer';
    footer.textContent='Todos os direitos reservados © ROBOTBM 2026';
    main.appendChild(footer);
  }catch(err){
    console.error('Erro ao abrir a aba '+p+':',err);
    main.innerHTML=`<div class="head"><div><h1>Não foi possível abrir esta aba</h1><p>O sistema encontrou um registro com problema ou um erro nesta tela.</p></div></div><div class="notice error"><b>Detalhe:</b> ${esc(err && err.message ? err.message : 'Erro inesperado')}</div><div class="panel" style="margin-top:12px"><p>Seus dados não foram apagados. Tente abrir outra aba. Se o erro continuar, faça primeiro um backup na aba Administração.</p><button class="primary" onclick="go('home')">Voltar ao início</button></div>`;
  }
}

window.printAllTickets=()=>{if(!d.tickets.length)return alert('Ainda não há ingressos vendidos.');let w=window.open('','_blank','width=650,height=800');if(!w)return alert('Permita pop-ups no Chrome para gerar o PDF.');let pages=d.tickets.map(t=>`<section class="ticket"><h1>INGRESSO DO PARQUE</h1><p>${esc(t.type)}</p><div class="num">${esc(t.num)}</div><p>Participante: ${esc(t.visitor||'Visitante')}</p>${t.buyer?`<p class="sub">Titular da compra: ${esc(t.buyer)}</p>`:''}<p>Venda: ${esc(t.sold||'')}</p><img class="qr" src="${qrImage(t,240)}"><p>Apresente este QR Code na entrada</p></section>`).join('');w.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>Ingressos do Parque - PDF</title><style>body{font:16px Arial;color:#111;margin:0}.ticket{height:96vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;page-break-after:always;break-after:page}.ticket:last-child{page-break-after:auto}.qr{width:210px;height:210px}.num{font-size:30px;font-weight:bold;letter-spacing:2px;border:2px solid #222;padding:10px}h1{font-size:24px}.sub{font-size:13px;color:#555}</style></head><body>${pages}<script>window.onload=()=>window.print()<\/script></body></html>`);w.document.close()};
window.startScanner=async()=>{if(!window.jsQR){alert('O leitor de QR Code não carregou. Verifique a internet e recarregue a página.');return}if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){alert('A câmera não está disponível neste modo do Chrome. Use a opção de selecionar uma foto do QR Code ou digite o número.');return}try{scanStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});let v=$('#scanVideo'),canvas=document.createElement('canvas'),ctx=canvas.getContext('2d',{willReadFrequently:true});$('#scanArea').classList.remove('hidden');v.srcObject=scanStream;await v.play();scanTimer=setInterval(()=>{if(!scanStream||v.readyState<2||!v.videoWidth)return;canvas.width=v.videoWidth;canvas.height=v.videoHeight;ctx.drawImage(v,0,0,canvas.width,canvas.height);let data=ctx.getImageData(0,0,canvas.width,canvas.height),code=jsQR(data.data,data.width,data.height,{inversionAttempts:'attemptBoth'});if(code){let parts=String(code.data||'').split('|');stopScanner();if(parts.length===3&&parts[0]==='PARQUE'){let t=d.tickets.find(x=>x.id===parts[1]&&x.num===parts[2]);if(t){$('#entryNum').value=t.num;$('#entryForm').requestSubmit()}else $('#entryMsg').innerHTML='<div class="notice error">Ingresso não reconhecido neste parque.</div>'}else $('#entryMsg').innerHTML='<div class="notice error">QR Code não pertence a este sistema.</div>'}},300)}catch(err){stopScanner();alert('Não foi possível acessar a câmera. Use a opção de selecionar uma foto do QR Code ou digite o número do ingresso.')}};
function stopScanner(){if(scanTimer){clearInterval(scanTimer);scanTimer=null}if(scanStream){scanStream.getTracks().forEach(t=>t.stop());scanStream=null}let v=$('#scanVideo');if(v)v.srcObject=null;let a=$('#scanArea');if(a)a.classList.add('hidden')};window.stopScanner=stopScanner;
window.typeEdit=k=>{let t=d.types.find(x=>x.id===k),n=prompt('Nome:',t.name);if(n===null)return;let p=prompt('Preço:',t.price);if(p===null)return;if(!n.trim()||!Number.isFinite(+p)||+p<0)return alert('Dados inválidos');t.name=n.trim();t.price=+p;save();render('menu')};

window.callQueue=async k=>{let x=d.queueLocal.find(q=>q.id===k);if(!x)return;if(x.remoteId&&sb&&reservationUser){await sb.from('park_queue_calls').update({status:'Aguardando'}).eq('status','Chamando');let {error}=await sb.from('park_queue_calls').update({status:'Chamando',called_at:new Date().toISOString()}).eq('id',x.remoteId);if(error)return alert('Erro ao chamar: '+error.message)}else{d.queueLocal.forEach(q=>{if(q.status==='Chamando')q.status='Aguardando'});x.status='Chamando';x.calledAt=now();save()}logAction('Chamou senha '+x.code);render('queue')};window.callNextQueue=async()=>{if(reservationUser&&sb){let {data,error}=await sb.from('park_queue_calls').select('*').eq('status','Aguardando').order('created_at',{ascending:true}).limit(1);if(error)return alert(error.message);if(!data?.length)return alert('Não há senhas aguardando.');let x=data[0];d.queueLocal.push({id:String(x.id),remoteId:x.id,code:x.ticket_code,sector:x.sector,name:x.visitor_name||'',status:x.status,time:new Date(x.created_at).toLocaleTimeString('pt-BR'),date:date()});return callQueue(String(x.id))}let x=d.queueLocal.find(q=>q.status==='Aguardando');if(!x)return alert('Não há senhas aguardando.');callQueue(x.id)};window.finishQueue=async k=>{let x=d.queueLocal.find(q=>q.id===k);if(!x)return;if(x.remoteId&&sb&&reservationUser){let {error}=await sb.from('park_queue_calls').update({status:'Concluída',finished_at:new Date().toISOString()}).eq('id',x.remoteId);if(error)return alert(error.message)}else{x.status='Concluída';x.finishedAt=now();save()}logAction('Concluiu senha '+x.code);render('queue')};window.resetQueueLocal=()=>{if(confirm('Limpar as senhas emitidas hoje neste navegador?')){d.queueLocal=d.queueLocal.filter(x=>x.date!==date());save();render('queue')}};window.openQueueDisplay=()=>{let w=window.open(location.pathname+'?painel=senhas','_blank');if(!w)alert('Permita pop-ups no Chrome para abrir o painel.')};window.restoreBackup=()=>{let file=$('#restoreFile')?.files?.[0];if(!file)return alert('Selecione um arquivo JSON.');if(!confirm('Restaurar este backup e substituir os dados locais atuais?'))return;let r=new FileReader();r.onload=()=>{try{let obj=JSON.parse(r.result);if(!obj||!Array.isArray(obj.tickets)||!Array.isArray(obj.staff))throw new Error('Arquivo não parece ser um backup do Parque • Gestão.');localStorage.setItem(KEY,JSON.stringify(obj));alert('Backup restaurado. O sistema será recarregado.');location.reload()}catch(e){alert('Não foi possível restaurar: '+e.message)}};r.readAsText(file)};
window.backup=()=>{let blob=new Blob([JSON.stringify(d,null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='backup-parque-gestao.json';a.click();URL.revokeObjectURL(u)};

window.openStore=()=>{
  let old=document.getElementById('reservationStore');if(old)old.remove();
  const types=d.types.filter(t=>t.active);
  const layer=document.createElement('section');layer.id='reservationStore';
  layer.style.cssText='position:fixed;inset:0;z-index:20;background:#0d0f12;color:#f2f4f7;overflow:auto;padding:22px';
  layer.innerHTML=`<div style="max-width:850px;margin:0 auto"><div class="head"><div><div class="brand">PARQUE <span>• GESTÃO</span></div><h1 style="margin-top:24px">Reserve seus ingressos</h1><p>Faça sua reserva agora e pague somente na chegada ao parque.</p></div><button onclick="closeStore()">Fechar ✕</button></div>
  <div class="notice success">A reserva não exige pagamento online. Seus ingressos serão emitidos depois da confirmação do pagamento presencial.</div>
  <div class="panel" style="margin-top:16px"><form id="publicReservationForm">
  <div class="row"><div class="field"><label>Nome do titular da reserva</label><input name="buyer" required maxlength="100" placeholder="Seu nome completo"></div><div class="field"><label>Telefone / WhatsApp</label><input name="phone" required maxlength="30" placeholder="(00) 00000-0000"></div></div>
  <div class="row"><div class="field"><label>Data pretendida da visita</label><input name="visitDate" type="date" min="${date()}" required></div><div class="field"><label>Tipo de ingresso</label><select name="type" required>${types.map(t=>`<option value="${esc(t.id)}">${esc(t.name)} — ${brl(t.price)}</option>`).join('')}</select></div></div>
  <div class="field"><label>Nome dos participantes (um por linha)</label><textarea name="participants" rows="5" required placeholder="Ana Silva&#10;Bruno Souza" style="width:100%;padding:10px;background:#0f1216;color:var(--t);border:1px solid var(--l);border-radius:7px"></textarea><div class="note">Cada participante receberá seu próprio ingresso após o pagamento no parque.</div></div>
  
  <button class="primary" ${types.length?'':'disabled'}>Confirmar reserva</button></form><div id="publicReservationResult"></div></div>
  <div class="note" style="margin-top:18px">Todos os direitos reservados © ROBOTBM 2026</div></div>`;
  document.body.appendChild(layer);
  const form=layer.querySelector('#publicReservationForm');
  form.onsubmit=async e=>{e.preventDefault();let f=new FormData(form),buyer=String(f.get('buyer')||'').trim(),phone=String(f.get('phone')||'').trim(),visitDate=String(f.get('visitDate')||''),names=String(f.get('participants')||'').split(/\r?\n/).map(x=>x.trim()).filter(Boolean),type=d.types.find(t=>t.id===f.get('type')&&t.active);
    if(!type)return alert('Tipo de ingresso indisponível.');if(!names.length||names.length>50)return alert('Informe entre 1 e 50 participantes.');if(!sb)return alert('Não foi possível iniciar a conexão. Verifique sua internet e tente novamente.');
    let items=names.map(name=>({visitor:name,type:type.name,price:Number(type.price),originalPrice:Number(type.price)})),total=Math.round(items.reduce((a,x)=>a+x.price,0)*100)/100;
    let code='RES-'+date().replaceAll('-','')+'-'+Math.floor(1000+Math.random()*9000);const submit=form.querySelector('button[type="submit"],button:not([type])');if(submit){submit.disabled=true;submit.textContent='Enviando reserva...'}
    try{let {error}=await sb.from('reservations').insert({code,holder_name:buyer,phone,visit_date:visitDate,ticket_type:type.name,participants:items,total,discount_percent:0});if(error)throw error;
      form.classList.add('hidden');layer.querySelector('#publicReservationResult').innerHTML=`<div class="notice success" style="margin-top:14px"><h2>Reserva realizada!</h2><p>Seu código de reserva:</p><div class="ticket-number">${esc(code)}</div><p><b>Titular:</b> ${esc(buyer)}<br><b>Data pretendida:</b> ${esc(visitDate)}<br><b>Quantidade:</b> ${items.length} ingresso(s)<br><b>Total a pagar no parque:</b> ${brl(total)}</p><p><b>Status: Aguardando pagamento.</b></p><p>Guarde o código e apresente-o na bilheteria. Os ingressos e QR Codes serão gerados após a confirmação do pagamento.</p><button onclick="closeStore()">Concluir</button></div>`;
    }catch(err){if(submit){submit.disabled=false;submit.textContent='Confirmar reserva'}alert('Não foi possível enviar sua reserva: '+(err.message||err)+'. Tente novamente.')}};
};
window.closeStore=()=>document.getElementById('reservationStore')?.remove();
function mapRemoteReservation(row){const parts=Array.isArray(row.participants)?row.participants:[];return {id:row.id,remoteId:row.id,code:row.code,buyer:row.holder_name,phone:row.phone,visitDate:row.visit_date,items:parts.map(x=>({visitor:x.visitor||x.name||'Participante',type:x.type||row.ticket_type||'Ingresso',price:Number(x.price||0),originalPrice:Number(x.originalPrice||x.original_price||x.price||0),ticketId:x.ticketId||x.ticket_id,num:x.num||x.ticket_num})),total:Number(row.total||0),discount:Number(row.discount_percent||0),couponCode:row.coupon_code||'',status:row.status||'Pendente',paidAt:row.paid_at||null,createdAt:row.created_at||''};}
window.syncReservations=async()=>{if(!sb||!reservationUser)return;try{let {data,error}=await sb.from('reservations').select('*').order('created_at',{ascending:false});if(error)throw error;const remote=(data||[]).map(mapRemoteReservation);const keep=d.reservations.filter(x=>!x.remoteId&&!remote.some(y=>y.id===x.id));d.reservations=[...keep,...remote];remote.filter(r=>r.status==='Paga').forEach(r=>r.items.forEach(item=>{if(item.ticketId&&item.num&&!d.tickets.some(t=>t.id===item.ticketId)){d.tickets.push({id:item.ticketId,num:item.num,visitor:item.visitor,buyer:r.buyer,type:item.type,price:item.price,pay:'Pagamento presencial',sold:r.paidAt||r.createdAt,date:r.visitDate,reservationCode:r.code})}}));save();render('reservations')}catch(err){alert('Não foi possível atualizar as reservas: '+(err.message||err))}};
window.reservationAuthLogout=async()=>{try{await sb?.auth.signOut()}catch(e){}reservationUser=null;d.reservations=d.reservations.filter(x=>!x.remoteId);save();render('reservations')};
window.confirmReservation=async k=>{let r=d.reservations.find(x=>x.id===k);if(!r||r.status!=='Pendente')return;if(!reservationUser||!r.remoteId)return alert('Conecte-se ao banco online e atualize as reservas antes de confirmar.');if(!confirm('Confirmar que o pagamento presencial foi recebido e emitir '+r.items.length+' ingresso(s)?'))return;if(reservationBusy)return;reservationBusy=true;try{let made=[];r.items.forEach(item=>{let n;do{n=String(Date.now()).slice(-7)+Math.floor(10+Math.random()*90)}while(d.tickets.some(x=>x.num===n));let t={id:id(),num:n,visitor:item.visitor,buyer:r.buyer,type:item.type,price:item.price,pay:'Pagamento presencial',sold:now(),date:date(),reservationCode:r.code};d.tickets.push(t);item.ticketId=t.id;item.num=t.num;made.push(t)});let {error}=await sb.from('reservations').update({status:'Paga',paid_at:new Date().toISOString(),paid_by:reservationUser.id,participants:r.items.map(x=>({visitor:x.visitor,type:x.type,price:x.price,originalPrice:x.originalPrice,ticketId:x.ticketId,num:x.num}))}).eq('id',r.remoteId);if(error){made.forEach(t=>{d.tickets=d.tickets.filter(x=>x.id!==t.id)});throw error}r.status='Paga';r.paidAt=now();r.ticketIds=made.map(t=>t.id);if(d.cash.open)d.cash.moves.push({kind:'in',desc:'Reserva '+r.code+' — pagamento presencial',amount:r.total,pay:'Pagamento presencial',time:now(),date:date()});save();render('reservations');alert('Pagamento confirmado. '+made.length+' ingresso(s) emitido(s). Consulte a aba Arquivos PDF.')}catch(err){alert('Não foi possível confirmar a reserva: '+(err.message||err))}finally{reservationBusy=false}};
window.cancelReservation=async k=>{let r=d.reservations.find(x=>x.id===k);if(!r||r.status!=='Pendente')return;if(!reservationUser||!r.remoteId)return alert('Conecte-se ao banco online antes de cancelar.');if(confirm('Cancelar a reserva '+r.code+'?')){try{let {error}=await sb.from('reservations').update({status:'Cancelada'}).eq('id',r.remoteId);if(error)throw error;r.status='Cancelada';r.cancelledAt=now();save();render('reservations')}catch(err){alert('Não foi possível cancelar: '+(err.message||err))}}};
window.reservationDetails=k=>{let r=d.reservations.find(x=>x.id===k);if(!r)return;alert('Reserva: '+r.code+'\nTitular: '+r.buyer+'\nContato: '+r.phone+'\nVisita: '+r.visitDate+'\nParticipantes: '+r.items.map(x=>x.visitor).join(', ')+'\nTotal: '+brl(r.total)+'\nStatus: '+r.status+(r.ticketIds?'\nIngressos: '+r.ticketIds.length:''));};


save();
})();
</script></body></html>
